<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2457d6">
<title>Penghitung Nilai</title>
<style>
:root{--blue:#2858c8;--orange:#a85a17;--ink:#202938;--muted:#718096}
*{box-sizing:border-box}body{margin:0;background:#f1f4fa;color:var(--ink);font-family:Arial,sans-serif;padding:16px}
main{max-width:900px;margin:auto}.panel{background:#fff;border-radius:24px;padding:20px;margin-bottom:18px;box-shadow:0 5px 22px #26395b0c}
h1{font-size:25px;margin:0 0 8px}h2{font-size:21px;margin:0 0 16px}.sub{color:var(--muted);font-size:14px;line-height:1.45;margin:0 0 18px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}button{border:0;border-radius:13px;padding:13px 16px;font-size:14px;font-weight:700;cursor:pointer}
.blue{background:#e9f0ff;color:var(--blue)}.orange{background:#fff1df;color:var(--orange)}.red{background:#ffe6e6;color:#ad3030}
.table-wrap{overflow-x:auto;border-bottom:1px solid #e5e9ef;padding-bottom:8px}
table{border-collapse:separate;border-spacing:0;min-width:620px;width:100%}
th,td{padding:10px 8px;border-bottom:1px solid #e8ebf0;text-align:center;white-space:nowrap}
th{background:#f8fafc}th:first-child,td:first-child{min-width:180px;text-align:left}
.group-plus{color:var(--blue);font-weight:700}.group-minus{color:var(--orange);font-weight:700}
input{font:inherit;font-size:16px;border:1px solid #cfd6df;border-radius:13px;padding:13px 12px;width:100%;min-width:105px;background:#fff;color:#172033;text-align:center}
.name-input{text-align:left;min-width:160px}.cell-input{min-width:115px}
.xbtn{padding:7px 10px;border-radius:99px;background:#ffe5e5;color:#ad3030;margin-top:6px}
.summary-list{display:grid;gap:10px}
.total-item{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#eef4ff;border-radius:14px;padding:14px 16px}
.total-name{font-weight:700;overflow-wrap:anywhere}.total-value{font-size:23px;font-weight:800;color:var(--blue);white-space:nowrap}
.empty{color:var(--muted);font-size:14px}
.summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}
.stat{background:#eef4ff;border-radius:18px;padding:16px;color:#6c7b91}.stat strong{display:block;color:var(--blue);font-size:29px;margin-top:5px}.stat.wide{grid-column:1/-1}
.footer{text-align:center;color:#78869a;font-size:13px;padding:12px}
@media(max-width:480px){body{padding:10px}.panel{padding:15px;border-radius:20px}.total-value{font-size:20px}}
</style>
</head>
<body><main>
<section class="panel">
<h1>Penghitung Nilai</h1>
<p class="sub">Kolom nilai tambah (+) dan pengurang (−) disusun berselang-seling. Total akhir setiap nama tampil terpisah di bawah tabel.</p>
<div class="actions">
<button class="blue" id="addName">＋ Tambah Nama</button>
<button class="blue" id="addValue">＋ Tambah Nilai</button>
<button class="orange" id="addMinus">− Tambah Pengurang</button>
<button class="blue" id="csv">Unduh CSV</button>
</div>
<div class="table-wrap"><table id="grid"></table></div>
<div class="actions" style="margin:20px 0 0"><button class="red" id="clear">Hapus Semua Data</button></div>
</section>
<section class="panel">
<h2>Total Akhir Masing-Masing Nama</h2>
<div class="summary-list" id="totals"></div>
<div class="summary-grid">
<div class="stat">Jumlah nama<strong id="countNames">0</strong></div>
<div class="stat">Kolom nilai<strong id="countValues">0</strong></div>
<div class="stat wide">Kolom pengurang<strong id="countMinus">0</strong></div>
</div>
</section>
<div class="footer">Penghitung Nilai · Data tersimpan di perangkat ini</div>
</main>
<script>
const STORAGE='penghitungNilaiTableV4';
let state={names:[''],values:['Nilai 1'],minus:['Pengurang 1'],rows:[{values:[0],minus:[0]}]};
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(STORAGE));if(s&&Array.isArray(s.names)&&Array.isArray(s.values)&&Array.isArray(s.minus)&&Array.isArray(s.rows))state=s}catch(e){}}
function num(v){return Number(v)||0}
function total(row){return row.values.reduce((a,b)=>a+num(b),0)-row.minus.reduce((a,b)=>a+num(b),0)}
function render(){
 const t=$('grid');t.innerHTML='';const thead=document.createElement('thead'),hr=document.createElement('tr');
 const nh=document.createElement('th');nh.textContent='Nama';hr.append(nh);
 // Tampilkan kolom secara berselang-seling: Nilai 1, Pengurang 1, Nilai 2, Pengurang 2, dst.
 const columns=[];
 for(let i=0;i<Math.max(state.values.length,state.minus.length);i++){
  if(i<state.values.length)columns.push({kind:'values',index:i,label:state.values[i],caption:'＋ Nilai',cls:'group-plus'});
  if(i<state.minus.length)columns.push({kind:'minus',index:i,label:state.minus[i],caption:'− Pengurangan',cls:'group-minus'});
 }
 columns.forEach(col=>{
  const th=document.createElement('th'),cap=document.createElement('div');cap.className=col.cls;cap.textContent=col.caption;
  const inp=document.createElement('input');inp.value=col.label;inp.setAttribute('aria-label','Nama kolom '+col.caption);
  inp.addEventListener('input',()=>{state[col.kind][col.index]=inp.value;save()});
  const del=document.createElement('button');del.className='xbtn';del.textContent='×';del.title='Hapus kolom';del.onclick=()=>{state[col.kind].splice(col.index,1);state.rows.forEach(r=>r[col.kind].splice(col.index,1));render()};
  th.append(cap,inp,del);hr.append(th);
 });
 thead.append(hr);t.append(thead);
 const tbody=document.createElement('tbody');
 state.names.forEach((name,i)=>{
  const tr=document.createElement('tr'),td=document.createElement('td'),ni=document.createElement('input');ni.className='name-input';ni.placeholder='Nama';ni.value=name;
  ni.addEventListener('input',()=>{state.names[i]=ni.value;updateTotals();save()});td.append(ni);tr.append(td);
  columns.forEach(col=>{
   const cell=document.createElement('td'),inp=document.createElement('input');inp.className='cell-input';inp.type='number';inp.inputMode='decimal';inp.placeholder='0';inp.value=state.rows[i][col.kind][col.index]??0;
   inp.addEventListener('input',()=>{state.rows[i][col.kind][col.index]=inp.value;updateTotals();save()});cell.append(inp);tr.append(cell);
  });
  tbody.append(tr);
 });
 t.append(tbody);updateTotals();updateStats();save();
}
function updateTotals(){const box=$('totals');box.innerHTML='';state.names.forEach((name,i)=>{const item=document.createElement('div');item.className='total-item';const n=document.createElement('span');n.className='total-name';n.textContent=name||'Nama '+(i+1);const v=document.createElement('strong');v.className='total-value';v.textContent=total(state.rows[i]).toLocaleString('id-ID',{maximumFractionDigits:2});item.append(n,v);box.append(item)});if(!state.names.length)box.innerHTML='<div class="empty">Belum ada nama.</div>'}
function updateStats(){$('countNames').textContent=state.names.length;$('countValues').textContent=state.values.length;$('countMinus').textContent=state.minus.length}
function addName(){state.names.push('');state.rows.push({values:state.values.map(()=>0),minus:state.minus.map(()=>0)});render()}
function addColumn(kind){state[kind].push(kind==='values'?'Nilai '+(state.values.length+1):'Pengurang '+(state.minus.length+1));state.rows.forEach(r=>r[kind].push(0));render()}
$('addName').onclick=addName;$('addValue').onclick=()=>addColumn('values');$('addMinus').onclick=()=>addColumn('minus');
$('clear').onclick=()=>{if(confirm('Hapus semua nama dan nilai?')){state={names:[''],values:['Nilai 1'],minus:['Pengurang 1'],rows:[{values:[0],minus:[0]}]};render()}};
$('csv').onclick=()=>{
 const headers=['Nama'],data=state.names.map((n,i)=>[n]);
 for(let i=0;i<Math.max(state.values.length,state.minus.length);i++){
  if(i<state.values.length){headers.push(state.values[i]);data.forEach((r,j)=>r.push(state.rows[j].values[i]))}
  if(i<state.minus.length){headers.push(state.minus[i]);data.forEach((r,j)=>r.push(state.rows[j].minus[i]))}
 }
 headers.push('Total Akhir');data.forEach((r,i)=>r.push(total(state.rows[i])));
 const csv=[headers,...data].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='data-nilai.csv';a.click();URL.revokeObjectURL(a.href)
};
load();state.names.forEach((_,i)=>{state.rows[i].values=state.rows[i].values||state.values.map(()=>0);state.rows[i].minus=state.rows[i].minus||state.minus.map(()=>0)});render();
</script></body></html>
