name: Build APK

of:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q PenghitungNilaiAndroid_SiapBuildAPK.zip
          cd PenghitungNilaiAndroid
          gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Penghitung-Nilai-APK
          path: PenghitungNilaiAndroid/app/build/outputs/apk/debug/app-debug.apk
